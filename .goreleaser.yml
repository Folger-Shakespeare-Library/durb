version: 2

builds:
  - main: ./cmd/tess
    binary: tess
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "tess-{{ .Os }}-{{ .Arch }}"
